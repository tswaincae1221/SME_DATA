[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gk2a-weather"
version = "0.1.0"
description = "GK-2A satellite features for ASOS temperature and humidity prediction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "requests>=2.31,<3",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "xarray>=2024.1",
  "h5netcdf>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

