name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src scripts tests kaggle_cell2_template.py
      - name: Test
        run: python -m pytest
      - name: LE1B path audit
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/gk2a_weather/data/gk2a.py").read_text(encoding="utf-8")
          assert "/GK2A/LE1B/" in source
          for line_number, line in enumerate(source.splitlines(), start=1):
              if "api/GK2A/" in line:
                  assert "api/GK2A/LE1B/" in line, line_number
          print("LE1B-only path: PASS")
          PY
